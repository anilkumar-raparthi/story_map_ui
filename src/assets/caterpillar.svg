<!-- Cute segmented caterpillar with bite marks -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160" fill="none">
<path d="M20 110c20-40 80-70 150-60 20 3 50 16 70 40" fill="none" stroke="#f07a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.06" />
<g transform="translate(10,20)">
<g>
<ellipse cx="30" cy="80" rx="28" ry="20" fill="#ffedcc" stroke="#f2b86a" stroke-width="4" />
<ellipse cx="70" cy="70" rx="32" ry="22" fill="#f9e3b8" stroke="#f2b86a" stroke-width="4" />
<ellipse cx="110" cy="66" rx="36" ry="24" fill="#ffedcc" stroke="#f2b86a" stroke-width="4" />
<ellipse cx="155" cy="72" rx="30" ry="20" fill="#f9e3b8" stroke="#f2b86a" stroke-width="4" />
</g>
<!-- face -->
<circle cx="20" cy="70" r="6" fill="#3b2e2e" />
<path d="M8 78 q12 10 24 0" stroke="#3b2e2e" stroke-width="2" fill="none" stroke-linecap="round" />
<!-- leaf bite -->
<path d="M190 92 q20 -12 40 -18 8 8 12 18 -24 10 -52 0z" fill="#7bbf59" stroke="#5fa546" stroke-width="3" />
</g>
</svg>